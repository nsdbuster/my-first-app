<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nandkumar Deshpande | Bigpro Solution Pvt. Ltd.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f1117;
            color: #e4e4e7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .initials {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #f4f4f5;
            margin-bottom: 0.75rem;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 2px;
            margin: 1.25rem auto;
        }

        .company {
            font-size: 1.25rem;
            color: #a1a1aa;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        footer {
            position: fixed;
            bottom: 1.5rem;
            color: #52525b;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="initials">ND</div>
        <h1>Nandkumar Deshpande</h1>
        <div class="divider"></div>
        <p class="company">Bigpro Solution Pvt. Ltd.</p>
    </div>
    <footer>&copy; 2026 Bigpro Solution Pvt. Ltd.</footer>
</body>
</html>
